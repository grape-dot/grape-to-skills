[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storyboard-sheet-prompt"
version = "1.3.0"
description = "Turn a scene into a locked-consistent 16:9 hand-drawn storyboard sheet prompt, with a mandatory Pixar stylized-realism contract."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "yanfang" }]
keywords = [
    "storyboard",
    "prompt-engineering",
    "agent-skill",
    "animation",
    "pre-production",
    "pixar",
    "text-to-image",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Multimedia :: Graphics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/"

[project.scripts]
storyboard-sheet = "assemble:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["assemble"]
