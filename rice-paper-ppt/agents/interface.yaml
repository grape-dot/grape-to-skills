interface:
  display_name: "Rice Paper PPT"
  short_description: "warm rice-paper HTML slide deck with projector-grade typography, a writing-style spec, and a Playwright layout audit"
  default_prompt: "Use $rice-paper-ppt to build or restyle this deck as a 1280×720 rice-paper HTML deck. Start from assets/starter.html, keep theme.css/deck.js as-is except :root tokens, keep body text ≥20px and tables/code ≥18px, and keep the 512px content area — if content does not fit, change the structure, never shrink the type. Read references/typography-spec.md before setting sizes and references/page-patterns.md before choosing a layout. For a page holding four or more related images, use the picture-wall patterns in references/page-patterns.md §12 (staggered photo cards / one large-S wave band bleeding edge to edge / true-perspective depth grid anchored to the right edge / asymmetric leaf-shaped band cut by a single clip-path / seven inline-SVG segments coiling along one band, each segment clipped and filled separately (spiral scroll: seams drawn by re-stroking the same paths, two placements — full-page 637x720 bleeding top/right/bottom (flush to the page bottom) / content page 430x485 in the right column) / four frames fanned across a half circle in a radial layout (semi-circular fan: one centre below the stage), with the title plate in the notch under the inner arc / four portrait frames cut by a single arc that extends the band sideways  / a 5x3 grid of 15 tiles curling into one cylinder segment - the centre column faces the viewer while the outer columns turn away, narrowing and darkening outward (matrix grid: each column is one prism face, transform: translateZ(-R) rotateY(phi) translateZ(R) with R = column width / 2sin(half step); stack all five columns at the container midpoint with absolute positioning - laying them out with flex doubles the spacing and throws columns off-canvas; never put filter on the container or the 3D flattens) / four shared-edge trapezoids folded into one arc, adjacent frames sharing the exact same pair of fold-line endpoints (folding screen: never rotate frames individually, fold seam = a 3px highlight plus a dark edge, gap must stay 0) / four portrait frames on one continuous arc band, end frames enlarged and middle receding (arc screen: shared-edge trapezoids again, flip the curvature with .sag for the inner arc) / nine portrait frames bottom-aligned in one row, heights mirrored left-right into a skyline that dips toward the middle where one dark tower rises to full container height (skyline: the dark centre frame .pk is the only darkened block on the page and the visual anchor - darken it with brightness(.55) or the skyline reads as a ragged flat top; keep the height table symmetric): equal widths and equal heights — never vary per-image height to fake a curve, it leaves visible steps at the seams; 3px paper-coloured seams, one title band, no per-image cards. The arc-cut band rises in one direction only (low left to high right, a single cubic — never a symmetric dip in the middle). The fan pattern cuts every frame as a wedge from the same centre and leaves a 0.08deg gap at each side of a wedge (never a fixed px inset — it opens into a cone near the centre); headings in both the fan and the arc-cut band must sit outside the clipped element — clip-path erases every child inside it. Depth needs perspective + rotateY — skewX gives no near-large/far-small. Animate with the built-in 0.7s CSS entrance by default; if the effect genuinely needs choreography, include assets/fx.js (it exits by itself when gsap is absent and hands over when present), vendor gsap locally under assets/vendor/, and register WebGL/canvas effects through RP.fx.register with a cleanup function. HTML is the delivery format, not a capability ceiling — but static correctness, offline capability, and terminal state under print/shot/reduced-motion are non-negotiable, and text always stays in the DOM, never in a canvas. object-fit:cover is allowed only for same-subject sets with subjects inside the centre 60%. Structure content first with references/content-structure-spec.md: replace vague references with exact technical terms, compress long paragraphs into keywords or workflows, pick visual structure by content relation, keep qualifiers and parameters. Draft all titles and body copy against references/copywriting-spec.md: noun-phrase titles, one idea per sentence, consistent terminology; avoid mechanical contrast patterns, colloquial lead-ins, and empty marketing slogans. After drafting, run BOTH the section 08 language review (copywriting-spec.md) and the section 10 A–H structure review (content-structure-spec.md) page by page, and apply fixes silently. When the number of images on one page is known (1-10 or many), pick the skeleton from references/image-count-layouts.md (count-based quick table with two variants per count and matched content themes); counts 1-3 and beyond 10 sit outside the twelve wall patterns, and when the two tables disagree, change the image count (add, drop, or split pages) instead of shrinking images. When you finish a few pages, run scripts/audit.js against a local server and fix hard issues to zero."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
