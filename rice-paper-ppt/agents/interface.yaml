interface:
  display_name: "Rice Paper PPT"
  short_description: "warm rice-paper HTML slide deck with projector-grade typography, a writing-style spec, and a Playwright layout audit"
  default_prompt: "Use $rice-paper-ppt to build or restyle this deck as a 1280×720 rice-paper HTML deck. Start from assets/starter.html, keep theme.css/deck.js as-is except :root tokens, keep body text ≥20px and tables/code ≥18px, and keep the 512px content area — if content does not fit, change the structure, never shrink the type. Read references/typography-spec.md before setting sizes and references/page-patterns.md before choosing a layout. For a page holding four or more related images, use the picture-wall patterns in references/page-patterns.md §12 (staggered photo cards / one large-S wave band bleeding edge to edge / true-perspective depth grid anchored to the right edge / asymmetric leaf-shaped band cut by a single clip-path): equal widths and equal heights — never vary per-image height to fake a curve, it leaves visible steps at the seams; 3px paper-coloured seams, one title band, no per-image cards. Depth needs perspective + rotateY — skewX gives no near-large/far-small. Animate with the built-in 0.7s CSS entrance by default; if the effect genuinely needs choreography, include assets/fx.js (it exits by itself when gsap is absent and hands over when present), vendor gsap locally under assets/vendor/, and register WebGL/canvas effects through RP.fx.register with a cleanup function. HTML is the delivery format, not a capability ceiling — but static correctness, offline capability, and terminal state under print/shot/reduced-motion are non-negotiable, and text always stays in the DOM, never in a canvas. object-fit:cover is allowed only for same-subject sets with subjects inside the centre 60%. Structure content first with references/content-structure-spec.md: replace vague references with exact technical terms, compress long paragraphs into keywords or workflows, pick visual structure by content relation, keep qualifiers and parameters. Draft all titles and body copy against references/copywriting-spec.md: noun-phrase titles, one idea per sentence, consistent terminology; avoid mechanical contrast patterns, colloquial lead-ins, and empty marketing slogans. After drafting, run BOTH the section 08 language review (copywriting-spec.md) and the section 10 A–H structure review (content-structure-spec.md) page by page, and apply fixes silently. When you finish a few pages, run scripts/audit.js against a local server and fix hard issues to zero."
compatibility:
  canonical_format: "agent-skills"
  adapter_targets:
    - "openai"
    - "claude"
    - "generic"
  activation:
    mode: "manual"
    paths: []
  execution:
    context: "inline"
    shell: "bash"
  trust:
    source_tier: "local"
    remote_inline_execution: "forbid"
    remote_metadata_policy: "allow-metadata-only"
  degradation:
    openai: "metadata-adapter"
    claude: "neutral-source-plus-adapter"
    generic: "neutral-source"
