<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 2 式 · 波浪贯通式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .pat-d { margin: 10px 0 0; font-size: 20px; line-height: 1.5; color: var(--ink-3); letter-spacing: .02em; }
  </style>
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide">
      <div class="sh">
        <div class="kick">图片墙 · 第 2 式</div>
        <h1 class="stitle">波浪贯通式</h1>
        <p class="pat-d">多张图片沿连续波浪曲线拼接，形成整体画面</p>
      </div>
      <div class="sb">
        <div class="wall w-wave">
          <img src="img/vg1.jpg" alt=""><img src="img/vg2.jpg" alt="">
          <img src="img/vg3.jpg" alt=""><img src="img/vg4.jpg" alt="">
        </div>
        <div class="wcap-l">
          <div class="figcap">图注：整条只起伏一次，四张等宽、左右出血铺满；缝里透出的是纸色。</div>
        </div>
      </div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
