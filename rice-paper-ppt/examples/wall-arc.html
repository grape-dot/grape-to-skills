<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 10 式 · 弧幕连屏式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide">
      <div class="sh">
        <div class="kick">图片墙 · 第 10 式</div>
        <h1 class="stitle">弧幕连屏式</h1>
      </div>
      <div class="sb">
        <p class="lead">多张竖幅图片<b>沿弧线连续排列</b>，形成环幕视觉效果。</p>
        <div class="wall w-arc">
          <div class="ai"><img src="img/vg1.jpg" alt=""></div>
          <div class="ai"><img src="img/vg2.jpg" alt=""></div>
          <div class="ai"><img src="img/vg3.jpg" alt=""></div>
          <div class="ai"><img src="img/vg4.jpg" alt=""></div>
        </div>
        <div class="figcap">图注：外端 6%–94%、中段 12.5%–87.5%；相邻两片共用同一对折线端点。</div>
      </div>
      <div class="foot"><span>图片墙 · 第 10 式　弧幕连屏式</span><span>10 / 15</span></div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
