<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 4 式 · 不对称叶片式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .pat-d { margin: 10px 0 0; font-size: 20px; line-height: 1.5; color: var(--ink-3); letter-spacing: .02em; }
  </style>
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide">
      <div class="sh">
        <div class="kick">图片墙 · 第 4 式</div>
        <h1 class="stitle">不对称叶片式</h1>
        <p class="pat-d">图片以不对称弧形边缘连接，形成叶片般的视觉效果</p>
      </div>
      <div class="sb">
        <div class="wall w-fan">
          <img src="img/vg1.jpg" alt=""><img src="img/vg2.jpg" alt="">
          <img src="img/vg3.jpg" alt=""><img src="img/vg4.jpg" alt="">
        </div>
        <div class="wcap">
          <div class="figcap" style="margin:0">图注：左端最厚、中间最薄、右端回升；整条由一条遮罩裁出，接缝处没有台阶。</div>
        </div>
      </div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
