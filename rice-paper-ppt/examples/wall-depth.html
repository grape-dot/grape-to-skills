<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 3 式 · 纵深渐进式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .pat-d { margin: 10px 0 0; font-size: 20px; line-height: 1.5; color: var(--ink-3); letter-spacing: .02em; }
  </style>
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide">
      <div class="sh">
        <div class="kick">图片墙 · 第 3 式</div>
        <h1 class="stitle">纵深渐进式</h1>
        <p class="pat-d">图片按纵向层次递进排列，营造空间纵深感</p>
      </div>
      <div class="sb">
        <div class="grow" style="display:grid;grid-template-columns:30% 1fr;gap:20px">
          <div class="col" style="justify-content:flex-end">
            <p class="cb sm" style="margin:0;line-height:1.7">近端放大、远端收窄，右缘出血贴边；<br>八格沿垂直轴旋转 25°，靠透视而不是<br>斜切。</p>
          </div>
          <div class="w-depth-stage">
            <div class="w-depth">
              <img src="img/vg1.jpg" alt=""><img src="img/vg2.jpg" alt=""><img src="img/vg3.jpg" alt=""><img src="img/vg4.jpg" alt="">
              <img src="img/vg4.jpg" alt=""><img src="img/vg3.jpg" alt=""><img src="img/vg2.jpg" alt=""><img src="img/vg1.jpg" alt="">
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
