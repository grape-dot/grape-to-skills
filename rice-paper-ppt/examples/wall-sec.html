<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 6 式 · 半圆扇面式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .pat-d { margin: 10px 0 0; font-size: 20px; line-height: 1.5; color: var(--ink-3); letter-spacing: .02em; }
  </style>
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide on">
      <div class="sh">
        <h1 class="stitle">半圆扇面式</h1>
        <p class="pat-d">多张图片围绕半圆展开，呈扇形放射状布局</p>
      </div>
      <div class="sb">
        <div class="sec-wrap">
          <div class="wall w-sec">
            <div class="sd"><img src="img/vg1.jpg" alt=""></div>
            <div class="sd"><img src="img/vg2.jpg" alt="" ></div>
            <div class="sd"><img src="img/vg3.jpg" alt=""></div>
            <div class="sd"><img src="img/vg5.jpg" alt=""></div>
          </div>
        </div>
      </div>
      <div class="foot"><span>图片墙 · 第 6 式　半圆扇面式</span><span>06 / 11</span></div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
