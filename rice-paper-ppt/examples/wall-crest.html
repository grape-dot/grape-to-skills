<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 7 式 · 弧形切幅式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .pat-d { margin: 10px 0 0; font-size: 20px; line-height: 1.5; color: var(--ink-3); letter-spacing: .02em; }
  </style>
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide">
      <div class="sh">
        <h1 class="stitle">弧形切幅式</h1>
        <p class="pat-d">通过弧形裁切形成横向视觉延伸，突出图片主体</p>
      </div>
      <div class="sb">
        <div class="crest-wrap">
          <div class="wall w-crest">
            <img src="img/vg1.jpg" alt="">
            <img src="img/vg2.jpg" alt="">
            <img src="img/vg3.jpg" alt="">
            <img src="img/vg5.jpg" alt="">
          </div>
          <div class="crest-head">
            <div class="figcap">图注：上缘一条弧只升不落，格内不裁高度。</div>
          </div>
        </div>
      </div>
      <div class="foot"><span>图片墙 · 第 7 式　弧形切幅式</span><span>07 / 11</span></div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
