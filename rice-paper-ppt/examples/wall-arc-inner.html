<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 11 式 · 弧幕连屏式（内弧） · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide">
      <div class="sh">
        <div class="kick">图片墙 · 第 11 式 · 内弧</div>
        <h1 class="stitle">弧幕连屏式（内弧）</h1>
      </div>
      <div class="sb">
        <p class="lead">同一组竖幅<b>反向弯曲</b>，中段鼓起、两端收进，视线被压回画面中央。</p>
        <div class="wall w-arc sag">
          <div class="ai"><img src="img/vg1.jpg" alt=""></div>
          <div class="ai"><img src="img/vg2.jpg" alt=""></div>
          <div class="ai"><img src="img/vg3.jpg" alt=""></div>
          <div class="ai"><img src="img/vg4.jpg" alt=""></div>
        </div>
        <div class="figcap">图注：与上页同一组参数，只把弧向翻转过来，中段鼓起、两端收进。</div>
      </div>
      <div class="foot"><span>图片墙 · 第 11 式　弧幕连屏式（内弧）</span><span>11 / 15</span></div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
