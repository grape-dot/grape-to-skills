<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 1 式 · 齐边错落式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
  <style>
    .pat-d { margin: 10px 0 0; font-size: 20px; line-height: 1.5; color: var(--ink-3); letter-spacing: .02em; }
  </style>
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide on">
      <div class="sh">
        <div class="kick">图片墙 · 第 1 式</div>
        <h1 class="stitle">齐边错落式</h1>
        <p class="pat-d">多张图片独立排列，通过上下错位形成节奏感</p>
      </div>
      <div class="sb">
        <div class="wall w-stag">
          <div class="pc"><img src="img/vg1.jpg" alt=""></div>
          <div class="pc"><img src="img/vg2.jpg" alt=""></div>
          <div class="pc"><img src="img/vg3.jpg" alt=""></div>
          <div class="pc"><img src="img/vg4.jpg" alt=""></div>
        </div>
        <div class="wcap">
          <div class="figcap">图注：四张同高，只把偶数张下移 66px：白边 7px 与双层投影让它们像摆在纸上。</div>
        </div>
      </div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
