<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 8 式 · 矩阵网格式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide on">
      <div class="sh">
        <div class="kick">图片墙 · 第 8 式</div>
        <h1 class="stitle">矩阵网格式</h1>
      </div>
      <div class="sb">
        <p class="lead">多张图片<b>按照规则网格排列</b>，强调整体性与秩序感。</p>
        <div class="wall w-cyl">
          <div class="cc"><img src="img/vg1.jpg" alt=""></div>
          <div class="cc"><img src="img/vg2.jpg" alt=""></div>
          <div class="cc"><img src="img/vg3.jpg" alt=""></div>
          <div class="cc"><img src="img/vg4.jpg" alt=""></div>
        </div>
        <div class="figcap">图注：中缝不动、两翼各转 22°，端列比中缝矮 17%；外缘留一道 3px 纸边。</div>
      </div>
      <div class="foot"><span>图片墙 · 第 8 式　矩阵网格式</span><span>08 / 11</span></div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
