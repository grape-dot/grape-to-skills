<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 13 式 · 四季弧线式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <!-- 13 四季弧线式：四扇底边对齐（align-items:flex-end），顶边沿拱形时间轴起伏——
         高度表 244 → 300 → 348（峰，偏右不放正中）→ 320，爬升缓、回落更缓。
         每扇顶边左上一枚哑光金节点（暖白描边），读成钉在弧形时间轴上的四帧。
         与 12 峰谷天际线的分野：那式对称压轴靠深色主塔，这式单向行进讲时间。
         动画：四扇沿时间轴从左到右逐扇浮起。 -->
    <section class="slide on">
      <div class="sh">
        <div class="kick">图片墙 · 第 13 式</div>
        <h1 class="stitle">四季弧线式</h1>
      </div>
      <div class="sb">
        <p class="lead">图片<b>沿弧形时间轴排列</b>，适合表达季节、时间与变化。</p>
        <div class="wall w-tarc">
          <div class="pc"><img src="img/vg6.jpg" alt=""></div>
          <div class="pc"><img src="img/vg2.jpg" alt=""></div>
          <div class="pc"><img src="img/vg3.jpg" alt=""></div>
          <div class="pc"><img src="img/vg5.jpg" alt=""></div>
        </div>
        <div class="figcap">图注：四扇底边对齐，顶边沿拱形时间轴爬升再回落（244 → 300 → 348 → 320），弧顶偏右；顶边金色节点即时间轴刻度。</div>
      </div>
      <div class="foot"><span>图片墙 · 第 13 式　四季弧线式</span><span>13 / 14</span></div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
