<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 9 式 · 斜切折页式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide">
      <div class="sh">
        <div class="kick">图片墙 · 第 9 式</div>
        <h1 class="stitle">斜切折页式</h1>
      </div>
      <div class="sb">
        <p class="lead">左侧通过倾斜切口形成<b>不规则几何形状</b>，右侧由多张图片组成<b>连续的立体折页</b>，呈现从单一形态向完整画面展开的视觉效果。</p>
        <div class="wall w-fold">
          <div class="lf"><img src="img/vg6.jpg" alt=""></div>
          <div class="lf"><img src="img/vg2.jpg" alt=""></div>
          <div class="lf"><img src="img/vg1.jpg" alt=""></div>
          <div class="spine"></div>
          <div class="lf"><img src="img/vg4.jpg" alt=""></div>
          <div class="lf"><img src="img/vg3.jpg" alt=""></div>
          <div class="lf"><img src="img/vg5.jpg" alt=""></div>
          <div class="funnel"><p class="fcap">图注：六扇竖幅顶边对齐，底边两段斜切、向中央折脊逐级收拢；折脊下方的漏斗接住展开的斜线，图注落在其中。</p></div>
        </div>
      </div>
      <div class="foot"><span>图片墙 · 第 9 式　斜切折页式</span><span>09 / 12</span></div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
