<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="utf-8">
  <title>图片墙 第 9 式 · 折页长卷式 · rice-paper-ppt 示例</title>
  <link rel="stylesheet" href="../assets/theme.css">
</head>

<body>
  <div class="pbar"></div>
  <div id="deck">

    <section class="slide">
      <div class="sh">
        <div class="kick">图片墙 · 第 9 式</div>
        <h1 class="stitle">折页长卷式</h1>
      </div>
      <div class="sb">
        <p class="lead">图片<b>以连续折页方式展开</b>，形成空间层次与立体感。</p>
        <div class="wall w-fold">
          <div class="lf"><img src="img/vg1.jpg" alt=""></div>
          <div class="lf"><img src="img/vg2.jpg" alt=""></div>
          <div class="lf"><img src="img/vg3.jpg" alt=""></div>
          <div class="lf"><img src="img/vg4.jpg" alt=""></div>
        </div>
        <div class="figcap">图注：折线 6 → 46 → 6 → 46 → 6，竖边高矮交替成之字；相邻两片共用同一对端点，折缝是一道高光接一道暗边。</div>
      </div>
      <div class="foot"><span>图片墙 · 第 9 式　折页长卷式</span><span>09 / 11</span></div>
    </section>
  </div>
  <script src="../assets/deck.js"></script>
</body>

</html>
